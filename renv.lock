      "Author": "Thorsten Pohlert [aut, cre] (<https://orcid.org/0000-0003-3855-3025>)",
      "Maintainer": "Thorsten Pohlert <thorsten.pohlert@gmx.de>",
      "Repository": "https://packagemanager.posit.co/cran/__linux__/jammy/latest"
    },
